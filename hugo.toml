baseURL = 'https://anub8te.github.io/'
languageCode = 'en-us'
title = 'Anub8x'
theme = 'after-hours'
enableRobotsTXT = true
summaryLength = 30

[outputs]
  home = ['HTML', 'RSS', 'JSON']
[taxonomies]
  category = 'categories'
  tag = 'tags'
[params]
  author = 'Anub8te'
  description = 'Anub8te — aspiring exploit developer focused on exploit development and reverse engineering.'
  github = 'https://github.com/Anub8te'
  telegram = 'https://t.me/Anub8x'
  # Add URLs here when ready; empty values stay hidden.
  website = ''
  linkedin = ''
  discord = ''
  ctftime = ''
  hackthebox = ''
  tryhackme = ''
[markup.goldmark.renderer]
  unsafe = false
[markup.highlight]
  noClasses = false
  codeFences = true
  guessSyntax = false
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false
[services.rss]
  limit = 30
[related]
  threshold = 20
  includeNewer = true
  [[related.indices]]
    name = 'tags'
    weight = 100
